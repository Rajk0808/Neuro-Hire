name: Frontend CI
on:
  push:
    branches: [ "main" , "master" ]
    paths:
      - 'apps/frontend/**' # Triggers only on frontend folder changes
  pull_request:
    branches: [ "main" , "master" ]
    paths:
      - 'apps/frontend/**'

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Example assuming Node.js frontend. Change to python/go if needed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./apps/frontend
