name: Backend CI

on:
  push:
    branches: [ "main" , "master" ]
    paths:
      - 'apps/backend/**' # Triggers only on backend folder changes
  pull_request:
    branches: [ "main" , "master" ]
    paths:
      - 'apps/backend/**'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Set up Python instead of Node.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can change this to 3.11 or 3.12 depending on your project
          cache: 'pip' # Built-in caching for python dependencies
          cache-dependency-path: 'apps/backend/requirements.txt'

      # 2. Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./apps/backend # Executes command inside backend folder

      # 3. Optional: Run your FastAPI tests (e.g., pytest) if you have them
      # - name: Run Tests
      #   run: pytest
      #   working-directory: ./apps/backend