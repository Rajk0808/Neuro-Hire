name: Backend CI

on:
  push:
    branches: [ "main" , "master" ]
    paths:
      - 'apps/backend/**' # Triggers only on backend folder changes
  pull_request:
    branches: [ "main" , "master" ]
    paths:
      - 'apps/backend/**'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Example assuming Node.js backend. Change to python/go if needed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: ./apps/backend # Executes command inside backend folder

      - name: Run Tests
        run: npm test
        working-directory: ./apps/backend
