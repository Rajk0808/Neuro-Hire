services:
  - type: web
    name: neurohire-frontend
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.neurohire.example.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://api.neurohire.example.com
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
